name: Build Hokama ERP EXE

on:
  push:
    branches: [main]
    paths:
      - 'app.py'
      - 'app_desktop.py'
      - 'database.py'
      - 'services/**'
      - 'ui/**'
      - 'requirements.txt'
      - 'icon.ico'
      - '.github/workflows/build-exe.yml'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
      
      # ✅ 1. إنشاء مجلد النموذج والملف الفارغ
      - name: Create Model Placeholder
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path models | Out-Null
          New-Item -ItemType File -Force -Path models\ai-model.gguf | Out-Null
      
      # ✅ 2. تحميل النموذج الصغير (Qwen2 0.5B) للتجربة
      - name: Download Small AI Model (For Testing)
        shell: pwsh
        run: |
          Write-Host "Downloading Small AI Model (approx. 270 MB)..."
          $url = "https://huggingface.co/Qwen/Qwen2-0.5B-Instruct-GGUF/resolve/main/qwen2-0_5b-instruct-q4_k_m.gguf"
          Invoke-WebRequest -Uri $url -OutFile "models\ai-model.gguf"
          Write-Host "Model downloaded successfully. Size:"
          Get-Item "models\ai-model.gguf" | Select-Object Length
      
      - name: Build EXE (Edge Native Mode)
        shell: cmd
        run: |
          pyinstaller --noconfirm --onedir --windowed --icon=icon.ico --name=HokamaERP ^
          --copy-metadata streamlit --copy-metadata pandas --copy-metadata altair --copy-metadata numpy --copy-metadata plotly ^
          --collect-submodules streamlit ^
          --collect-data streamlit ^
          --hidden-import streamlit.web.cli ^
          --hidden-import cryptography.fernet ^
          --hidden-import database ^
          --add-data "app.py;." --add-data "database.py;." --add-data "ui;ui" --add-data "services;services" --add-data "icon.ico;." ^
          --exclude-module tkinter --exclude-module matplotlib --exclude-module scipy --exclude-module IPython --exclude-module jupyter --exclude-module notebook --exclude-module pytest --exclude-module sphinx ^
          app_desktop.py
      
      # ✅ 3. نسخ النموذج إلى مجلد التوزيع النهائي
      - name: Copy AI Model to Dist Folder
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist\HokamaERP\models | Out-Null
          Copy-Item -Path models\ai-model.gguf -Destination dist\HokamaERP\models\ai-model.gguf -Force
      
      - name: Cleanup tests and pycache
        shell: pwsh
        run: |
          Get-ChildItem -Path dist/HokamaERP -Recurse -Directory |
            Where-Object { $_.Name -eq '__pycache__' -or $_.Name -eq 'tests' } |
            Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
          
          Get-ChildItem -Path dist/HokamaERP -Recurse -Include *.pyc,*.pyo |
            Where-Object { $_.FullName -match 'tests|test_' } |
            Remove-Item -Force -ErrorAction SilentlyContinue
      
      - name: Install 7-Zip
        run: |
          choco install 7zip -y
      
      - name: Create ZIP with 7-Zip
        shell: pwsh
        run: |
          & "C:\Program Files\7-Zip\7z.exe" a -tzip -mx=9 HokamaERP-Windows.zip .\dist\HokamaERP\*
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: HokamaERP-Windows
          path: HokamaERP-Windows.zip
          compression-level: 0
