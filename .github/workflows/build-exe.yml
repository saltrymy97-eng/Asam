name: Build Hokama ERP EXE (Flet)

on:
  push:
    branches: [main]
    paths:
      - 'ui_flet/**'
      - 'services/**'
      - 'database.py'
      - 'pyproject.toml'
      - 'icon.ico'
      - '.github/workflows/build-exe.yml'
  workflow_dispatch:
    inputs:
      version:
        description: 'الإصدار (مثال: 3.0.0)'
        required: false
        default: '3.0.0'

jobs:
  build-windows:
    runs-on: windows-latest
    
    permissions:
      contents: write

    # ⬇️⬇️⬇️ الحل هنا: إجبار UTF-8 ⬇️⬇️⬇️
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
      PYTHONLEGACYWINDOWSSTDIO: "0"
    # ⬆️⬆️⬆️

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
          flutter-version: '3.24.5'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ui_flet/requirements.txt

      - name: Determine Version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="3.0.${{ github.run_number }}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "📦 Building version: $VERSION"

      # ⬇️⬇️⬇️ تعديل مهم: توجيه المخرجات لتجنب مشاكل الرموز ⬇️⬇️⬇️
      - name: Build Windows EXE
        working-directory: ui_flet
        shell: pwsh
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: "1"
        run: |
          # تعطيل ألوان rich لتجنب مشاكل الرموز
          $env:NO_COLOR = "1"
          $env:TERM = "dumb"
          $env:COLUMNS = "200"
          
          # البناء
          flet build windows 2>&1 | Tee-Object -FilePath build.log
        timeout-minutes: 30

      # ⬇️⬇️⬇️ عرض سجل البناء عند الفشل ⬇️⬇️⬇️
      - name: Show Build Log (on failure)
        if: failure()
        working-directory: ui_flet
        shell: pwsh
        run: |
          if (Test-Path build.log) {
            Write-Host "=== BUILD LOG ==="
            Get-Content build.log -Tail 100
          }

      - name: Cleanup Build Artifacts
        shell: pwsh
        run: |
          Get-ChildItem -Path ui_flet/build/windows -Recurse -Directory -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -eq '__pycache__' -or $_.Name -eq 'tests' } |
            Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
          
          Get-ChildItem -Path ui_flet/build/windows -Recurse -Include *.pyc,*.pyo -ErrorAction SilentlyContinue |
            Remove-Item -Force -ErrorAction SilentlyContinue

      - name: Create ZIP
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $sourcePath = "ui_flet/build/windows/*"
          $zipName = "HokamaERP-v$version-Windows.zip"
          
          if (Test-Path $sourcePath) {
            Compress-Archive -Path $sourcePath -DestinationPath $zipName -CompressionLevel Optimal
            Write-Host "✅ Created: $zipName"
            Get-Item $zipName | Format-List Name, Length
          } else {
            Write-Error "❌ Build folder not found!"
            exit 1
          }

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HokamaERP-Windows-${{ steps.version.outputs.version }}
          path: HokamaERP-v${{ steps.version.outputs.version }}-Windows.zip
          retention-days: 90

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Hokama ERP v${{ steps.version.outputs.version }}
          body: |
            ## 🎉 حوكمة ERP - الإصدار ${{ steps.version.outputs.version }}
            
            ### 📦 التحميل
            حمّل الملف `HokamaERP-v${{ steps.version.outputs.version }}-Windows.zip`، فك الضغط، ثم شغّل `HokamaERP.exe`.
            
            ### ⚙️ المتطلبات
            - Windows 10 أو أحدث (64-bit)
            - لا يحتاج Python أو Flet أو Flutter
          files: HokamaERP-v${{ steps.version.outputs.version }}-Windows.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
