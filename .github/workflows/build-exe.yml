name: Build Hokama ERP EXE (Flet)

on:
  push:
    branches: [main]
    paths:
      - 'ui_flet/**'
      - 'services/**'
      - 'database.py'
      - 'icon.ico'
      - '.github/workflows/build-exe.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-2022
    timeout-minutes: 120

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Setup Flutter 3.27.1
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.27.1'
          cache: true

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ui_flet/requirements.txt

      - name: Copy Shared Files into ui_flet (For Flet Build)
        shell: pwsh
        run: |
          Copy-Item -Path "database.py" -Destination "ui_flet/database.py" -Force
          Copy-Item -Path "services" -Destination "ui_flet/services" -Recurse -Force
          Write-Host "✅ Shared files copied to ui_flet temporarily for build."

      # ⬇️⬇️⬇️ التعديل الحاسم هنا ⬇️⬇️⬇️
      - name: Build Windows Application
        working-directory: ui_flet
        shell: pwsh
        run: |
          # إجبار UTF-8 لتجنب UnicodeEncodeError
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          $env:PYTHONIOENCODING = "utf-8"
          $env:PYTHONUTF8 = "1"
          $env:NO_COLOR = "1"
          $env:TERM = "dumb"
          $env:COLUMNS = "200"

          flet build windows --verbose

      - name: Prepare Release ZIP
        if: success()
        shell: pwsh
        run: |
          $zipName = "HokamaERP-Windows.zip"
          Compress-Archive -Path "ui_flet/build/windows/*" -DestinationPath $zipName -CompressionLevel Optimal -Force

      - name: Upload Build Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: HokamaERP-Windows
          path: HokamaERP-Windows.zip

      - name: Create GitHub Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.0.${{ github.run_number }}
          name: Hokama ERP v3.0.${{ github.run_number }}
          body: |
            # حوكمة ERP
            إصدار Windows جاهز للتشغيل.
          files: HokamaERP-Windows.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
