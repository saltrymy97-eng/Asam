name: Build Hokama ERP EXE (Flet)

on:
  push:
    branches: [main]
    paths:
      - 'ui_flet/**'
      - 'services/**'
      - 'database.py'
      - 'pyproject.toml'
      - 'icon.ico'
      - '.github/workflows/build-exe.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-2022
    timeout-minutes: 120

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Setup Flutter 3.27.1
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.27.1'
          cache: true

      # ⬇️⬇️⬇️ الفحص الصارم الجديد ⬇️⬇️⬇️
      - name: Strict Verify Project Structure
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $errors = @()

          Write-Host "🔍 Starting strict structure verification..." -ForegroundColor Cyan

          # 1. فحص ملف الإعدادات في الجذر
          if (-not (Test-Path "pyproject.toml")) {
            $errors += "❌ الملف pyproject.toml غير موجود في الجذر الرئيسي!"
          } else {
            # استخدام Python للتحقق الدقيق من المحتوى (بدلاً من النصوص)
            $pythonCheck = python -c @"
import tomllib
with open('pyproject.toml', 'rb') as f:
    data = tomllib.load(f)
app = data.get('tool', {}).get('flet', {}).get('app', {})
print(f"PATH_VALUE:{app.get('path', '')}")
print(f"MODULE_VALUE:{app.get('module', '')}")
"@
            $pathMatch = $pythonCheck | Select-String -Pattern "PATH_VALUE:(.*)" | ForEach-Object { $_.Matches.Groups[1].Value }
            $moduleMatch = $pythonCheck | Select-String -Pattern "MODULE_VALUE:(.*)" | ForEach-Object { $_.Matches.Groups[1].Value }

            if ($pathMatch -ne '.') {
              $errors += "❌ إعدادات خاطئة: path في pyproject.toml يجب أن تكون '.' (القيمة الحالية: '$pathMatch')"
            }
            if ($moduleMatch -ne 'ui_flet.main') {
              $errors += "❌ إعدادات خاطئة: module في pyproject.toml يجب أن تكون 'ui_flet.main' (القيمة الحالية: '$moduleMatch')"
            }
          }

          # 2. فحص الملفات الأساسية
          if (-not (Test-Path "ui_flet/main.py")) { $errors += "❌ الملف ui_flet/main.py غير موجود!" }
          if (-not (Test-Path "database.py")) { $errors += "❌ الملف database.py غير موجود في الجذر!" }
          if (-not (Test-Path "services")) { $errors += "❌ مجلد services غير موجود في الجذر!" }

          # 3. التأكد من عدم وجود pyproject.toml مكرر في ui_flet (لأنه يسبب تداخل)
          if (Test-Path "ui_flet/pyproject.toml") {
            $errors += "⚠️ تحذير: يوجد ملف pyproject.toml داخل ui_flet. يجب حذفه لتجنب التداخل."
          }

          # إذا وجدت أي أخطاء، أوقف العملية فوراً
          if ($errors.Count -gt 0) {
            Write-Host "`n🚨 STRUCTURE CHECK FAILED!" -ForegroundColor Red
            foreach ($err in $errors) { Write-Host $err -ForegroundColor Red }
            throw "Pre-flight check failed. Fix the paths above before building."
          }

          Write-Host "`n✅ All paths and configurations are strictly correct. Ready to build!" -ForegroundColor Green
      # ⬆️⬆️⬆️ نهاية الفحص الصارم ⬆️⬆️⬆️

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ui_flet/requirements.txt

      - name: Build Windows Application
        shell: pwsh
        run: |
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          $env:PYTHONIOENCODING = "utf-8"
          $env:PYTHONUTF8 = "1"
          $env:NO_COLOR = "1"
          $env:TERM = "dumb"
          $env:COLUMNS = "200"
          
          flet build windows --verbose

      - name: Create ZIP
        if: success()
        shell: pwsh
        run: |
          $zipName = "HokamaERP-Windows.zip"
          Compress-Archive -Path "build/windows/*" -DestinationPath $zipName -CompressionLevel Optimal -Force

      - name: Upload Build Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: HokamaERP-Windows
          path: HokamaERP-Windows.zip

      - name: Create GitHub Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.0.${{ github.run_number }}
          name: Hokama ERP v3.0.${{ github.run_number }}
          body: |
            # حوكمة ERP
            إصدار Windows جاهز للتشغيل.
          files: HokamaERP-Windows.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
