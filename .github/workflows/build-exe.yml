name: Build Hokama ERP EXE (Flet)

on:
  push:
    branches: [main]
    paths:
      - 'ui_flet/**'
      - 'services/**'
      - 'database.py'
      - 'pyproject.toml'
      - 'icon.ico'
      - '.github/workflows/build-exe.yml'
  workflow_dispatch:
    inputs:
      version:
        description: 'الإصدار'
        required: false
        default: '3.0.0'

jobs:
  build-windows:
    
    permissions:
      contents: write
    timeout-minutes: 120
    runs-on: windows-2022
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
      PYTHONLEGACYWINDOWSSTDIO: "0"
      # ⬇️⬇️⬇️ مفتاح الحل ⬇️⬇️⬇️
      CMAKE_GENERATOR: "Visual Studio 17 2022"
      FLUTTER_WINDOWS_VERSION: "2022"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      # ⬇️⬇️⬇️ ترقية Flutter إلى 3.27.1 (يدعم VS 2022) ⬇️⬇️⬇️
      - name: Setup Flutter 3.27.1
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
          flutter-version: '3.27.1'
      # ⬆️⬆️⬆️

      - name: Install Visual Studio 2022 Build Tools
        shell: pwsh
        run: |
          choco install visualstudio2022-workload-vctools -y --no-progress
        timeout-minutes: 30

      - name: Verify Flutter + VS 2022
        run: |
          flutter --version
          flutter config --windows-version=2022
          flutter doctor -v

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ui_flet/requirements.txt

      - name: Determine Version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="3.0.${{ github.run_number }}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "📦 Building version: $VERSION"

      - name: Build Windows EXE
        working-directory: ui_flet
        shell: pwsh
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: "1"
          CMAKE_GENERATOR: "Visual Studio 17 2022"
        run: |
          $env:NO_COLOR = "1"
          $env:TERM = "dumb"
          $env:COLUMNS = "200"
          flet build windows --verbose 2>&1 | Tee-Object -FilePath build.log
        timeout-minutes: 60

      - name: Show Build Log
        if: always()
        working-directory: ui_flet
        shell: pwsh
        run: |
          if (Test-Path build.log) {
            Write-Host "=== LAST 150 LINES ==="
            Get-Content build.log -Tail 150
          }

      - name: Cleanup Build Artifacts
        if: success()
        shell: pwsh
        run: |
          Get-ChildItem -Path ui_flet/build/windows -Recurse -Directory -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -eq '__pycache__' -or $_.Name -eq 'tests' } |
            Remove-Item -Recurse -Force -ErrorAction SilentlyContinue

      - name: Create ZIP
        if: success()
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $sourcePath = "ui_flet/build/windows/*"
          $zipName = "HokamaERP-v$version-Windows.zip"
          if (Test-Path $sourcePath) {
            Compress-Archive -Path $sourcePath -DestinationPath $zipName -CompressionLevel Optimal
            Write-Host "✅ Created: $zipName"
            Get-Item $zipName | Format-List Name, Length
          } else {
            Write-Error "❌ Build folder not found!"
            exit 1
          }

      - name: Upload Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: HokamaERP-Windows-${{ steps.version.outputs.version }}
          path: HokamaERP-v${{ steps.version.outputs.version }}-Windows.zip
          retention-days: 90

      - name: Create GitHub Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Hokama ERP v${{ steps.version.outputs.version }}
          body: |
            ## 🎉 حوكمة ERP - الإصدار ${{ steps.version.outputs.version }}
            ### 📦 التحميل
            حمّل `HokamaERP-v${{ steps.version.outputs.version }}-Windows.zip`، فك الضغط، شغّل `HokamaERP.exe`.
          files: HokamaERP-v${{ steps.version.outputs.version }}-Windows.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
